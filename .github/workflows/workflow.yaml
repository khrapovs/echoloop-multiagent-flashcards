name: Tests, Code Quality, Build

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run test suite
        run: uv run pytest tests/unit

  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    # Skip on forks or PRs where the secret is not available.
    if: vars.GOOGLE_API_KEY != '' || secrets.GOOGLE_API_KEY != ''
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Tell configure_genai() to use the Developer API, not Vertex AI.
      GOOGLE_GENAI_USE_VERTEXAI: "False"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run integration tests
        run: uv run pytest tests/integration -v

  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run pre-commit
        run: uv run prek run -v --show-diff-on-failure
      - name: Run ty
        run: uv run ty check

  publish:
    name: Build and publish wheels
    needs: [test, integration-test, code-quality]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/echoloop/
    permissions:
      id-token: write
      contents: read
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Build
        run: uv build
