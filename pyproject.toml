[project]
name = "echoloop"
version = "0.7.0"
description = "A multi-agent, multi-modal language learning application that utilizes collaborative LLM agents to dynamically generate contextual, visual, and adaptive flashcards powered by spaced repetition."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Stanislav Khrapov", email = "khrapovs@gmail.com" }]

dependencies = [
  "google-adk[extensions]>=2.3.0",
  "google-agents-cli>=0.5.0",
  "google-cloud-logging>=3.16.0",
  "loguru>=0.7.3",
  "opentelemetry-api>=1.42.1",
  "opentelemetry-exporter-gcp-logging>=1.12.0a0",
  "opentelemetry-exporter-otlp>=1.42.1",
  "opentelemetry-sdk>=1.42.1",
  "streamlit>=1.58.0",
]

[project.scripts]
echoloop = "echoloop.cli:run_ui"

[dependency-groups]
dev = [
  "prek>=0.4.5",
  "pytest>=9.1.1",
  "ty>=0.0.51",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12"]
build-backend = "uv_build"

[tool.commitizen]
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
tag_format = "v$version"

[tool.ruff]
line-length = 120
src = ["echoloop", "tests"]

[tool.ruff.lint]
select = ["E", "F", "D", "B", "I", "ARG"]
ignore = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D203",
  "D213",
  "D417"
]

[tool.ty.rules]
no-matching-overload = "ignore"

[tool.uv.build-backend]
module-root = "."
module-name = "echoloop"

[tool.pytest.ini_options]
markers = [
  "e2e: end-to-end tests that require a running server and full Vertex AI credentials (deselect with '-m not e2e')",
]
